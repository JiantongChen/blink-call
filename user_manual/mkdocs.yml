site_name: Blink Call Manual
site_description: User manual for offline distributed Blink Call software
theme:
  name: material
site_language: zh

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
          site_name: 眨眼呼叫 用户手册
          nav_translations:
            Home: 首页
            Quick Start: 快速开始
            Settings: 设置
        - locale: en
          name: English
          build: true
          site_name: Blink Call Manual
          nav_translations:
            Home: Home
            Quick Start: Quick Start
            Settings: Settings

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Settings: settings.md
