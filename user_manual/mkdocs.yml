site_name: Blink Call Manual
site_url: https://jiantongchen.github.io/blink-call/
use_directory_urls: true
site_description: User manual for offline distributed Blink Call software
theme:
  name: material

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
          site_name: 眨眼呼叫 用户手册
          nav_translations:
            Home: 首页
            Quick Start: 快速开始
            First Use: 首次使用
            Daily Use: 日常使用
            Blink Pattern: 眨眼动作设置
            Camera: 摄像头设置
            Audio Alert: 提醒声音设置
            Advanced: 高级与辅助功能
        - locale: en
          name: English
          build: true
          site_name: Blink Call Manual
          nav_translations:
            Home: Home
            Quick Start: Quick Start
            First Use: First Use
            Daily Use: Daily Use
            Blink Pattern: Blink Pattern
            Camera: Camera
            Audio Alert: Audio Alert
            Advanced: Advanced

nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - First Use: first-use.md
  - Daily Use: daily-use.md
  - Blink Pattern: blink-pattern.md
  - Camera: camera.md
  - Audio Alert: audio-alert.md
  - Advanced: advanced.md
